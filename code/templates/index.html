<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DOK-univ_news_official</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>

<body>
    <div class="container">

        <header class="page-header">
            <h1>회사 검색</h1>
            <p>LinkedIn 대학 데이터를 이용하여 이미지를 생성합니다.</p>
        </header>

        <form method="POST" enctype="multipart/form-data">

            <section class="card">
                <h2>기본 정보</h2>

                <div class="grid-2">
                    <div class="field">
                        <label>검색용 회사명</label>
                        <input type="text" name="company" required>
                    </div>

                    <div class="field">
                        <label>표시용 회사명</label>
                        <input type="text" name="company_decoration" required>
                    </div>
                </div>

                <div class="field">
                    <label>회사 로고</label>
                    <input type="file" name="company_logo" accept="image/*">
                </div>
            </section>

            <section class="card">
                <h2>색상 설정</h2>

                <div class="color-grid">

                    <div class="field">
                        <label>회사명</label>
                        <input type="color" name="company_color">
                    </div>

                    <div class="field">
                        <label>순위</label>
                        <input type="color" name="color1">
                    </div>

                    <div class="field">
                        <label>로고</label>
                        <input type="color" name="color2">
                    </div>

                    <div class="field">
                        <label>학교명</label>
                        <input type="color" name="color3">
                    </div>

                    <div class="field">
                        <label>인원</label>
                        <input type="color" name="color4">
                    </div>

                    <div class="field">
                        <label>출처</label>
                        <input type="color" name="footer_color">
                    </div>

                </div>

                <button class="primary-btn" type="submit">
                    검색하기
                </button>

            </section>

            <section class="card">
                <h2>색상 추출기</h2>

                <canvas id="logoCanvas"></canvas>

                <div class="picked-color">

                    <input type="text" id="pickedColor" readonly>

                    <input type="color" id="pickedColorPreview">

                </div>

                <div class="button-group">
                    <button type="button" onclick="applyColor('company_color')">회사명</button>
                    <button type="button" onclick="applyColor('color1')">순위</button>
                    <button type="button" onclick="applyColor('color2')">로고</button>
                    <button type="button" onclick="applyColor('color3')">학교명</button>
                    <button type="button" onclick="applyColor('color4')">인원</button>
                    <button type="button" onclick="applyColor('footer_color')">출처</button>
                </div>

            </section>

        </form>

        {% if results %}

        <section class="card">

            <h2>생성된 문구</h2>

            <div class="field">
                <label>제목</label>
                <textarea id="generated_title">{{ title }}</textarea>
                <button onclick="copyText('generated_title')">
                    복사
                </button>
            </div>

            <div class="field">
                <label>내용</label>
                <textarea id="generated_content">{{ content }}</textarea>
                <button onclick="copyText('generated_content')">
                    복사
                </button>
            </div>

            <div class="field">
                <label>태그</label>
                <textarea id="generated_tags">{{ tags }}</textarea>
                <button onclick="copyText('generated_tags')">
                    복사
                </button>
            </div>

        </section>

        {% endif %}

    </div>
</body>

</html>
